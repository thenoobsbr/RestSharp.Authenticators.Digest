name: Publish NuGet Package

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
    branches:
      - 'release/[0-9]+.[0-9]+.[0-9]+'

env:
  HUSKY: 0

jobs:
  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/heads/release/* ]]; then
            SEMVER="${GITHUB_REF_NAME#release/}"
            RC_NUMBER="${GITHUB_RUN_NUMBER}"
            echo "version=${SEMVER}-rc.${RC_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore dependencies
        run: dotnet restore

      - name: Build with explicit version
        run: |
          dotnet build \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.version }} \
            --no-restore

      - name: Pack with symbols
        run: |
          dotnet pack \
            --configuration Release \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:IncludeSymbols=true \
            -p:SymbolPackageFormat=snupkg \
            --no-build \
            --output ./nupkgs

      - name: Publish .nupkg and .snupkg to NuGet.org
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --skip-duplicate

          dotnet nuget push ./nupkgs/*.snupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --skip-duplicate
